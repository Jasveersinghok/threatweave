[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "threatweave"
version = "0.1.0"
description = "A multi-agent Cyber Threat Intelligence analysis system"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.0",
    "litellm>=1.0.0",
    "instructor>=1.0.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "sentence-transformers>=2.2.0",
    "qdrant-client>=1.7.0",
    "stix2>=3.0.0",
    "pySigma>=0.10.0",
    "httpx>=0.25.0",
    "dnspython>=2.4.0",
    "geoip2>=4.7.0",
    "streamlit>=1.30.0",
    "OTXv2>=1.5.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
]

[project.scripts]
threatweave-ingest = "threatweave.knowledge.attack_ingest:main"

[tool.hatch.build.targets.wheel]
packages = ["src/threatweave"]

[tool.ruff]
src = ["src"]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
